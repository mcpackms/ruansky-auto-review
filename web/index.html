<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>high_bot · 日志</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{
  font-family:-apple-system,"SF Pro Display","Geist Sans","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  background:#F7F6F3;color:#2F3437;
  height:100dvh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale
}
@media(prefers-color-scheme:dark){
  body{background:#1A1B1E;color:#D1D0CB}
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#D1D0CB;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#A8A7A2}
@media(prefers-color-scheme:dark){
  ::-webkit-scrollbar-thumb{background:#4A4B4E}
  ::-webkit-scrollbar-thumb:hover{background:#6A6B6E}
}
h1,h2,h3,h4{font-weight:500;letter-spacing:-0.02em;color:#111}
@media(prefers-color-scheme:dark){h1,h2,h3,h4{color:#EEE}}
.mono{font-family:"SF Mono","Geist Mono","JetBrains Mono",monospace;font-size:0.875rem}
.label{font-family:"SF Mono","Geist Mono",monospace;font-size:0.6875rem;letter-spacing:0.04em;text-transform:uppercase;color:#A8A7A2}
@media(prefers-color-scheme:dark){.label{color:#6A6B6E}}
.header{
  padding:0 28px;height:52px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #EAEAEA;flex-shrink:0
}
@media(prefers-color-scheme:dark){.header{border-bottom-color:#2C2D30}}
.header-left{display:flex;align-items:center;gap:16px}
.header-logo{font-size:0.9375rem;font-weight:500;letter-spacing:-0.02em;color:#111}
@media(prefers-color-scheme:dark){.header-logo{color:#EEE}}
.header-status{display:flex;align-items:center;gap:6px;font-size:0.75rem}
.header-status .dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:#346538}
.header-status.paused .dot{background:#9F2F2D}
.header-status .status-text{color:#6A6B6E}
@media(prefers-color-scheme:dark){.header-status .status-text{color:#A8A7A2}}
.header-right{display:flex;align-items:center;gap:14px;font-size:0.75rem;color:#A8A7A2}
@media(prefers-color-scheme:dark){.header-right{color:#6A6B6E}}
.header-right button{
  background:none;border:1px solid #EAEAEA;color:#2F3437;
  padding:3px 10px;border-radius:4px;cursor:pointer;font-size:0.6875rem;
  font-family:inherit;transition:all 0.15s
}
.header-right button:hover{background:#EDF3EC;border-color:#C8CCC6}
@media(prefers-color-scheme:dark){
  .header-right button{border-color:#2C2D30;color:#D1D0CB}
  .header-right button:hover{background:#2C2D30;border-color:#4A4B4E}
}
.header-right button.active{background:#EDF3EC;border-color:#346538;color:#346538}
@media(prefers-color-scheme:dark){.header-right button.active{background:#1C2D20;border-color:#346538;color:#9ECE6A}}
.main{flex:1;padding:16px 28px;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.log-card{
  border:1px solid #EAEAEA;border-radius:8px;background:#FFF;
  display:flex;flex-direction:column;overflow:hidden;flex:1;min-height:0
}
@media(prefers-color-scheme:dark){.log-card{border-color:#2C2D30;background:#1F2023}}
.log-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;border-bottom:1px solid #F3F2F0;flex-shrink:0
}
@media(prefers-color-scheme:dark){.log-header{border-bottom-color:#26272A}}
.log-header .log-title{font-size:0.8125rem;font-weight:500;color:#111}
@media(prefers-color-scheme:dark){.log-header .log-title{color:#EEE}}
.log-header .log-info{font-size:0.6875rem;color:#A8A7A2;font-family:"SF Mono","Geist Mono",monospace}
.log-header .log-actions{display:flex;gap:6px}
.log-header .log-actions button{
  background:none;border:1px solid #EAEAEA;color:#A8A7A2;
  padding:2px 8px;border-radius:4px;cursor:pointer;font-size:0.6875rem;
  font-family:inherit;transition:all 0.15s
}
.log-header .log-actions button:hover{color:#2F3437;border-color:#C8CCC6}
@media(prefers-color-scheme:dark){
  .log-header .log-actions button{border-color:#2C2D30;color:#6A6B6E}
  .log-header .log-actions button:hover{color:#D1D0CB;border-color:#4A4B4E}
}
.log-header .log-actions button.active{background:#EDF3EC;border-color:#346538;color:#346538}
@media(prefers-color-scheme:dark){.log-header .log-actions button.active{background:#1C2D20;border-color:#346538;color:#9ECE6A}}
.log-body{
  flex:1;overflow-y:auto;padding:4px 0;
  font-family:"SF Mono","Geist Mono","JetBrains Mono",monospace;
  font-size:0.75rem;line-height:1.7
}
.log-entry{padding:1px 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-entry:hover{background:#F9F9F8}
@media(prefers-color-scheme:dark){.log-entry:hover{background:#26272A}}
.log-entry .t{color:#C8CCC6;margin-right:8px}
.log-entry.log-ok{color:#346538}
.log-entry.log-err{color:#9F2F2D}
.log-entry.log-info{color:#2F3437}
@media(prefers-color-scheme:dark){.log-entry.log-ok{color:#9ECE6A}}
@media(prefers-color-scheme:dark){.log-entry.log-err{color:#F7768E}}
@media(prefers-color-scheme:dark){.log-entry.log-info{color:#D1D0CB}}
.log-empty{text-align:center;padding:30px;color:#A8A7A2;font-size:0.8125rem}
@media(max-width:768px){
  .header{padding:0 16px}
  .main{padding:12px 16px}
}
@media(max-width:600px){
  .header-left .header-logo{display:none}
  .header-right .uptime{display:none}
}
@media(max-width:480px){
  .header-left .header-status .status-text{display:none}
  .main{padding:8px 10px}
  .log-entry{padding:1px 10px;font-size:0.6875rem}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <span class="header-logo">high_bot</span>
    <span class="header-status" id="headerStatus">
      <span class="dot" id="statusDot"></span>
      <span class="status-text" id="statusText">检测中</span>
    </span>
  </div>
  <div class="header-right">
    <span class="uptime" id="uptimeText">--</span>
    <button id="autoRefreshBtn" onclick="toggleAutoRefresh()">3s 刷新</button>
  </div>
</header>

<div class="main">
  <div class="log-card">
    <div class="log-header">
      <div>
        <span class="log-title">日志</span>
        <span class="log-info" id="logCount">0 条</span>
      </div>
      <div class="log-actions">
        <button onclick="toggleLogPause()" id="logPauseBtn">暂停</button>
        <button onclick="clearLog()">清空</button>
      </div>
    </div>
    <div class="log-body" id="logBody">
      <div class="log-empty">等待日志输出...</div>
    </div>
  </div>
</div>

<script>
var autoRefresh=true,refreshInterval=3000,refreshTimer=null,logPaused=false,lastLogCount=0,firstLoad=true;

function escapeHtml(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}

function getLogCls(msg){
  if(msg.indexOf('[ERROR]')!==-1)return'log-err';
  if(msg.indexOf('through')!==-1||msg.indexOf('approve')!==-1||msg.indexOf('reject')!==-1)return'log-ok';
  return'log-info';
}

function appendLogs(logs){
  var body=document.getElementById('logBody');
  if(!logs||!logs.length)return;
  for(var i=0;i<logs.length;i++){
    var e=document.createElement('div');
    e.className='log-entry '+getLogCls(logs[i].msg);
    var t='',msg=logs[i].msg,m=msg.match(/^\[(\d{2}:\d{2}:\d{2})\]/);
    if(m){t=m[1];msg=msg.substring(m[0].length)}
    e.innerHTML='<span class="t">'+t+'</span>'+escapeHtml(msg);
    body.appendChild(e);
  }
  document.getElementById('logCount').textContent=logs.length+' 条';
  if(!logPaused)body.scrollTop=body.scrollHeight;
}

function toggleLogPause(){
  logPaused=!logPaused;
  document.getElementById('logPauseBtn').textContent=logPaused?'继续':'暂停';
  document.getElementById('logPauseBtn').classList.toggle('active',logPaused);
  if(!logPaused){var b=document.getElementById('logBody');b.scrollTop=b.scrollHeight}
}

function clearLog(){document.getElementById('logBody').innerHTML='<div class="log-empty">日志已清空</div>';lastLogCount=0;document.getElementById('logCount').textContent='0 条'}

async function fetchJSON(url){
  try{
    var r=await fetch(url);
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){console.error('Fetch:',url,e);return null}
}

async function loadStatus(){
  var d=await fetchJSON('/api/status');
  if(!d)return;
  var s=document.getElementById('headerStatus'),dot=document.getElementById('statusDot'),txt=document.getElementById('statusText');
  if(d.running){s.className='header-status';dot.className='dot';txt.textContent='运行中'}
  else{s.className='header-status paused';dot.className='dot';txt.textContent='已停止'}
  document.getElementById('uptimeText').textContent='已运行 '+(d.uptime?fmtUptime(d.uptime):'--');
}

function fmtUptime(s){var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),s2=s%60;return h>0?h+'h '+m+'m':m>0?m+'m '+s2+'s':s2+'s'}

async function loadLogs(){
  var d=await fetchJSON('/api/logs?count=200');
  if(!d)return;
  var logs=d.logs||[];
  if(logs.length===0){if(firstLoad){document.getElementById('logBody').innerHTML='<div class="log-empty">暂无日志</div>';firstLoad=false}return}
  document.getElementById('logCount').textContent=logs.length+' 条';
  if(logs.length<=lastLogCount)return;
  var newLogs=logs.slice(lastLogCount);
  lastLogCount=logs.length;
  if(firstLoad){document.getElementById('logBody').innerHTML='';firstLoad=false}
  appendLogs(newLogs);
}

async function refreshAll(){await Promise.all([loadStatus(),loadLogs()])}
function toggleAutoRefresh(){
  autoRefresh=!autoRefresh;
  var btn=document.getElementById('autoRefreshBtn');
  if(autoRefresh){btn.textContent='3s 刷新';startAutoRefresh()}
  else{btn.textContent='刷新';stopAutoRefresh()}
}
function startAutoRefresh(){stopAutoRefresh();refreshTimer=setInterval(refreshAll,refreshInterval)}
function stopAutoRefresh(){if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}}
refreshAll();startAutoRefresh();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&autoRefresh)refreshAll()});
</script>
</body>
</html>
