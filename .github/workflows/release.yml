name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号 (e.g. v1.5.0)'
        required: true

permissions:
  contents: write

jobs:
  # ==================== Linux x86_64 ====================
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config \
            libncursesw5-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libpcre2-dev \
            nlohmann-json3-dev \
            libtoml11-dev
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - name: Package
        run: tar czf auto_review-linux-x86_64.tar.gz -C build auto_review
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: auto_review-linux-x86_64.tar.gz

  # ==================== Linux ARM64 (原生) ====================
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm   # 原生 ARM64 运行器
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config \
            libncursesw5-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libpcre2-dev \
            nlohmann-json3-dev \
            libtoml11-dev
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - name: Package
        run: tar czf auto_review-linux-arm64.tar.gz -C build auto_review
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: auto_review-linux-arm64.tar.gz
  # ==================== macOS ARM64 (Apple Silicon) ====================
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install cmake pkg-config ncurses curl openssl pcre2 nlohmann-json toml11
      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L$(brew --prefix ncurses)/lib"
          export CPPFLAGS="-I$(brew --prefix ncurses)/include"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Package
        run: tar czf auto_review-macos-arm64.tar.gz -C build auto_review
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: auto_review-macos-arm64.tar.gz

  # ==================== Release ====================
  release:
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums-sha256.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/auto_review-linux-x86_64.tar.gz
            artifacts/auto_review-linux-arm64.tar.gz
            artifacts/auto_review-macos-arm64.tar.gz
            artifacts/checksums-sha256.txt