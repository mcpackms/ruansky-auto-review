name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本号 (e.g. v1.5.0)'
        required: true

permissions:
  contents: write

jobs:
  # ==================== Linux x86_64 ====================
  build-linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config \
            libncursesw5-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libpcre2-dev \
            nlohmann-json3-dev \
            libtoml11-dev
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - name: Package
        run: tar czf auto_review-linux-x86_64.tar.gz -C build auto_review
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: auto_review-linux-x86_64.tar.gz

  # ==================== Linux ARM64 (原生) ====================
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm   # 原生 ARM64 运行器
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config \
            libncursesw5-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libpcre2-dev \
            nlohmann-json3-dev \
            libtoml11-dev
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - name: Package
        run: tar czf auto_review-linux-arm64.tar.gz -C build auto_review
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: auto_review-linux-arm64.tar.gz

  # ==================== Windows x86_64 ====================
  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-ncurses
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-7zip
            curl
      - name: Install toml11
        shell: msys2 {0}
        run: |
          curl -sL https://github.com/ToruNiina/toml11/archive/refs/tags/v3.8.1.tar.gz | tar xz -C /ucrt64/include --strip-components=1 toml11-3.8.1/toml.hpp toml11-3.8.1/toml
      - name: Build
        shell: msys2 {0}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G "MinGW Makefiles"
          cmake --build build -j$(nproc)
      - name: Package
        shell: msys2 {0}
        run: 7z a auto_review-windows-x86_64.zip ./build/auto_review.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: auto_review-windows-x86_64.zip

  # ==================== macOS ARM64 (Apple Silicon) ====================
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install cmake pkg-config ncurses curl openssl pcre2 nlohmann-json toml11
      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix ncurses)/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L$(brew --prefix ncurses)/lib"
          export CPPFLAGS="-I$(brew --prefix ncurses)/include"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.ncpu)
      - name: Package
        run: tar czf auto_review-macos-arm64.tar.gz -C build auto_review
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: auto_review-macos-arm64.tar.gz

  # ==================== Release ====================
  release:
    needs:
      - build-linux-x86_64
      - build-linux-arm64
      - build-windows-x86_64
      - build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums-sha256.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/auto_review-linux-x86_64.tar.gz
            artifacts/auto_review-linux-arm64.tar.gz
            artifacts/auto_review-windows-x86_64.zip
            artifacts/auto_review-macos-arm64.tar.gz
            artifacts/checksums-sha256.txt